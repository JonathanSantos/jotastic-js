name: CI
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Pacotes já buildados acima: só o build do Vite dos exemplos + medição.
      - run: npm run size:only
