<text x="82" y="334" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#B9B2BF">O componente roda uma vez. O compilador gera a reatividade,</text>
<text x="82" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#B9B2BF">e só o nó que mudou é tocado.</text>
