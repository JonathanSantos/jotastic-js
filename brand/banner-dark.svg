<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FBF7F2"><text x="40" y="84"><tspan fill="#FF8A70">export function</tspan> Counter() {</text><text x="62" y="109"><tspan fill="#FF8A70">let</tspan> count = <tspan fill="#7EE0C3">0</tspan></text><text x="62" y="134"><tspan fill="#FF8A70">const</tspan> double = count * <tspan fill="#7EE0C3">2</tspan></text><text x="40" y="159"></text><text x="62" y="184"><tspan fill="#FF8A70">return</tspan> (</text><text x="84" y="209">&lt;button onClick={() =&gt; count++}&gt;</text><text x="106" y="234">{count} × 2 = {double}</text><text x="84" y="259">&lt;/button&gt;</text><text x="62" y="284">)</text><text x="40" y="309">}</text></g>
