<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="470" viewBox="0 0 1188 470" role="img" aria-label="Núcleo reativo push-pull: count muda, isEven recalcula igual e o classList não roda"><title>Núcleo reativo push-pull: count muda, isEven recalcula igual e o classList não roda</title><rect width="1188" height="470" fill="#16131B"/><text x="40" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF" font-weight="700">SIGNAL</text><text x="330" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF" font-weight="700">MEMO</text><text x="620" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF" font-weight="700">EFEITO DE RENDER</text><text x="910" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF" font-weight="700">DOM</text><rect x="40" y="160" width="240" height="52" rx="12" fill="#FF5B3A" fill-opacity="0.14" stroke="#FF5B3A" stroke-width="2"/><text x="56" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">count  4 → 6</text><text x="56" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">set(6)</text><rect x="330" y="90" width="240" height="52" rx="12" fill="#FFC94A" fill-opacity="0.22" stroke="#FFC94A" stroke-width="2"/><text x="346" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">double  8 → 12</text><text x="346" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">CHECK → recalcula, mudou</text><rect x="330" y="230" width="240" height="52" rx="12" fill="#FFC94A" fill-opacity="0.22" stroke="#FFC94A" stroke-width="2"/><text x="346" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">isEven  true → true</text><text x="346" y="272" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">CHECK → recalcula, igual</text><rect x="620" y="70" width="240" height="52" rx="12" fill="#FF5B3A" fill-opacity="0.14" stroke="#FF5B3A" stroke-width="2"/><text x="636" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">text(_m0, count)</text><text x="636" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">DIRTY → roda</text><rect x="620" y="160" width="240" height="52" rx="12" fill="#FF5B3A" fill-opacity="0.14" stroke="#FF5B3A" stroke-width="2"/><text x="636" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">text(_m1, double)</text><text x="636" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">fonte mudou → roda</text><rect x="620" y="250" width="240" height="52" rx="12" fill="#221E29" fill-opacity="1" stroke="#3A3442" stroke-width="2"/><text x="636" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">classList(_p, isEven)</text><text x="636" y="292" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">fonte igual → pulado</text><rect x="910" y="70" width="230" height="52" rx="12" fill="#FFC94A" fill-opacity="0.22" stroke="#FFC94A" stroke-width="2"/><text x="926" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">#text "6"</text><g transform="translate(1150 82) scale(0.9)" stroke="#FFC94A" stroke-width="4" stroke-linecap="round"><path d="M0 0 L5 -5"/><path d="M3 10 H11"/><path d="M0 20 L5 25"/></g><rect x="910" y="160" width="230" height="52" rx="12" fill="#FFC94A" fill-opacity="0.22" stroke="#FFC94A" stroke-width="2"/><text x="926" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">#text "12"</text><g transform="translate(1150 172) scale(0.9)" stroke="#FFC94A" stroke-width="4" stroke-linecap="round"><path d="M0 0 L5 -5"/><path d="M3 10 H11"/><path d="M0 20 L5 25"/></g><rect x="910" y="250" width="230" height="52" rx="12" fill="#221E29" fill-opacity="1" stroke="#3A3442" stroke-width="2"/><text x="926" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2">&lt;p class="even"&gt;</text><text x="926" y="292" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#B9B2BF">intocado</text><path d="M280 186 C305.0 186 305.0 116 330 116" fill="none" stroke="#FF5B3A" stroke-width="2.5" stroke-linecap="round"/><path d="M280 186 C305.0 186 305.0 256 330 256" fill="none" stroke="#FF5B3A" stroke-width="2.5" stroke-linecap="round"/><path d="M280 172 C305 172 305 60 335 60 H585 C605 60 600 96 620 96" fill="none" stroke="#FF5B3A" stroke-width="2.5" stroke-linecap="round"/><path d="M570 116 C595.0 116 595.0 186 620 186" fill="none" stroke="#FFC94A" stroke-width="2.5" stroke-linecap="round"/><path d="M570 256 C595.0 256 595.0 276 620 276" fill="none" stroke="#3A3442" stroke-width="2.5" stroke-linecap="round"/><path d="M860 96 C885.0 96 885.0 96 910 96" fill="none" stroke="#FFC94A" stroke-width="2.5" stroke-linecap="round"/><path d="M860 186 C885.0 186 885.0 186 910 186" fill="none" stroke="#FFC94A" stroke-width="2.5" stroke-linecap="round"/><path d="M860 276 C885.0 276 885.0 276 910 276" fill="none" stroke="#3A3442" stroke-width="2.5" stroke-linecap="round"/><rect x="18" y="326" width="1152" height="126" rx="18" fill="#2B2632" stroke="#3A3442" stroke-width="2"/><circle cx="48" cy="357" r="11" fill="#FF5B3A"/><text x="48" y="362" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FBF7F2" font-weight="700" text-anchor="middle">1</text><text x="70" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#FBF7F2" font-weight="700">push</text><text x="130" y="362" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9B2BF">set() marca DIRTY os observadores diretos e CHECK os que dependem via memo</text><circle cx="48" cy="391" r="11" fill="#FF5B3A"/><text x="48" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FBF7F2" font-weight="700" text-anchor="middle">2</text><text x="70" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#FBF7F2" font-weight="700">pull</text><text x="130" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9B2BF">um nó CHECK pergunta às fontes memo se mudaram; se nenhuma mudou, volta a CLEAN</text><circle cx="48" cy="425" r="11" fill="#FF5B3A"/><text x="48" y="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#FBF7F2" font-weight="700" text-anchor="middle">3</text><text x="70" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#FBF7F2" font-weight="700">flush</text><text x="130" y="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B9B2BF">efeitos rodam numa fila de render e depois numa de usuário, ordenados por id (pai antes de filho)</text><rect x="40" y="76" width="14" height="14" rx="4" fill="#FF5B3A"/><text x="62" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B9B2BF">DIRTY</text><rect x="40" y="100" width="14" height="14" rx="4" fill="#FFC94A"/><text x="62" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B9B2BF">CHECK</text><rect x="40" y="124" width="14" height="14" rx="4" fill="#3A3442"/><text x="62" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B9B2BF">CLEAN</text></svg>
