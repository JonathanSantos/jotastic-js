<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="450" viewBox="0 0 1188 450" role="img" aria-label="Proxy profundo e lazy: signals por propriedade criados sob demanda, notificação só da chave mutada"><title>Proxy profundo e lazy: signals por propriedade criados sob demanda, notificação só da chave mutada</title><rect width="1188" height="450" fill="#FBF7F2"/><rect x="18" y="20" width="330" height="410" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/><circle cx="48" cy="56" r="14" fill="#FF5B3A"/><text x="48" y="61" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">1</text><text x="72" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#16131B" font-weight="700">Você escreve</text><text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#16131B">const todos = [</text><text x="56.2" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#16131B">{ title: 'Ler', done: false },</text><text x="56.2" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#16131B">{ title: 'Fazer', done: true },</text><text x="56.2" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#16131B">{ title: 'Rever', done: false },</text><text x="40" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#16131B">]</text><text x="40" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#5E5866"></text><text x="40" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#5E5866">&lt;li&gt;{todo.title}&lt;/li&gt;</text><text x="40" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#5E5866">&lt;input checked={todo.done}/&gt;</text><text x="40" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5866">Nenhuma anotação: o compilador</text><text x="40" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5866">envolve em reactive() porque é</text><text x="40" y="374" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5E5866">um array lido no JSX.</text><rect x="372" y="20" width="430" height="410" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/><circle cx="402" cy="56" r="14" fill="#FF5B3A"/><text x="402" y="61" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">2</text><text x="426" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#16131B" font-weight="700">O proxy cria sob demanda</text><rect x="396" y="90" width="382" height="64" rx="12" fill="#F4EEE6" stroke="#E2D9CE" stroke-width="2"/><text x="412" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B" font-weight="700">todos (proxy)</text><rect x="412" y="120" width="70" height="26" rx="13" fill="#F4EEE6" fill-opacity="1" stroke="#E2D9CE" stroke-width="2"/><text x="447.0" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">$iter</text><rect x="490" y="120" width="78" height="26" rx="13" fill="#F4EEE6" fill-opacity="1" stroke="#E2D9CE" stroke-width="2"/><text x="529.0" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">length</text><path d="M410 154 V210 H424" fill="none" stroke="#E2D9CE" stroke-width="2"/><rect x="424" y="180" width="354" height="64" rx="12" fill="#F4EEE6" stroke="#E2D9CE" stroke-width="2"/><text x="440" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B" font-weight="700">todos[0] (proxy)</text><rect x="440" y="210" width="64" height="26" rx="13" fill="#F4EEE6" fill-opacity="1" stroke="#E2D9CE" stroke-width="2"/><text x="472.0" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">title</text><rect x="512" y="210" width="60" height="26" rx="13" fill="#F4EEE6" fill-opacity="1" stroke="#E2D9CE" stroke-width="2"/><text x="542.0" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">done</text><path d="M410 154 V292 H424" fill="none" stroke="#E2D9CE" stroke-width="2"/><rect x="424" y="262" width="354" height="64" rx="12" fill="#F4EEE6" stroke="#E2D9CE" stroke-width="2"/><text x="440" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B" font-weight="700">todos[1] (proxy)</text><rect x="440" y="292" width="64" height="26" rx="13" fill="#F4EEE6" fill-opacity="1" stroke="#E2D9CE" stroke-width="2"/><text x="472.0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">title</text><rect x="512" y="292" width="60" height="26" rx="13" fill="#FFC94A" fill-opacity="0.35" stroke="#FFC94A" stroke-width="2"/><text x="542.0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16131B" text-anchor="middle">done</text><path d="M410 292 V374 H424" fill="none" stroke="#E2D9CE" stroke-width="2"/><rect x="424" y="344" width="354" height="64" rx="12" fill="none" stroke="#E2D9CE" stroke-width="2" stroke-dasharray="7 6"/><text x="440" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5E5866" font-weight="700">todos[2] (raw)</text><text x="440" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E5866">ainda não lido: nenhum proxy, nenhum signal</text><rect x="826" y="20" width="344" height="410" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/><circle cx="856" cy="56" r="14" fill="#FF5B3A"/><text x="856" y="61" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">3</text><text x="880" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#16131B" font-weight="700">Mutação notifica só a chave</text><rect x="846" y="92" width="304" height="140" rx="12" fill="#F4EEE6" stroke="#E2D9CE" stroke-width="2"/><text x="862" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B" font-weight="700">todos[1].done = false</text><text x="862" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5E5866">incrementa o signal "done"</text><text x="862" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5E5866">do item 1</text><rect x="862" y="186" width="270" height="26" rx="13" fill="#FFC94A" fill-opacity="0.35" stroke="#FFC94A" stroke-width="2"/><text x="997.0" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#16131B" text-anchor="middle">1 binding: o checkbox da linha 2</text><rect x="846" y="250" width="304" height="160" rx="12" fill="#F4EEE6" stroke="#E2D9CE" stroke-width="2"/><text x="862" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B" font-weight="700">todos.push({ … })</text><text x="862" y="306" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5E5866">roda no raw dentro de batch;</text><text x="862" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5E5866">notifica $iter e length</text><rect x="862" y="344" width="210" height="26" rx="13" fill="#FFC94A" fill-opacity="0.35" stroke="#FFC94A" stroke-width="2"/><text x="967.0" y="362" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#16131B" text-anchor="middle">list() cria 1 linha nova</text><text x="862" y="394" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5E5866">as outras linhas não rodam</text><path d="M574 305 C737.2 305 737.2 200 846 200" fill="none" stroke="#FFC94A" stroke-width="2.5" stroke-linecap="round"/></svg>
