<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="380" viewBox="0 0 1188 380" role="img" aria-label="Async: await vira recurso, id novo aborta a requisição anterior, Boundary mostra pending só na primeira carga"><title>Async: await vira recurso, id novo aborta a requisição anterior, Boundary mostra pending só na primeira carga</title><rect width="1188" height="380" fill="#16131B"/><rect x="18" y="20" width="1152" height="340" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FBF7F2" font-weight="700">const user = await api.user(id)</text><text x="48" y="88" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">o compilador transforma em recurso: refaz quando id muda e aborta a requisição anterior</text><text x="48" y="145" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF" font-weight="700">id</text><path d="M190 140 H1130" stroke="#3A3442" stroke-width="2"/><text x="48" y="211" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF" font-weight="700">requisição</text><path d="M190 206 H1130" stroke="#3A3442" stroke-width="2"/><text x="48" y="277" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF" font-weight="700">tela</text><path d="M190 272 H1130" stroke="#3A3442" stroke-width="2"/><circle cx="200" cy="140" r="15" fill="#FF5B3A"/><text x="200" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">1</text><circle cx="520" cy="140" r="15" fill="#FF5B3A"/><text x="520" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">2</text><circle cx="700" cy="140" r="15" fill="#FF5B3A"/><text x="700" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FBF7F2" font-weight="700" text-anchor="middle">3</text><rect x="200" y="193" width="240" height="26" rx="8" fill="#7EE0C3" fill-opacity="0.16" stroke="#7EE0C3" stroke-width="2"/><text x="212" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FBF7F2">GET /users/1</text><rect x="520" y="193" width="180" height="26" rx="8" fill="#FF5B3A" fill-opacity="0.16" stroke="#FF5B3A" stroke-width="2"/><text x="532" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FBF7F2">GET /users/2</text><g stroke="#FF5B3A" stroke-width="3" stroke-linecap="round"><path d="M692 196 L708 216"/><path d="M708 196 L692 216"/></g><text x="712" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B9B2BF">AbortSignal</text><rect x="700" y="193" width="260" height="26" rx="8" fill="#7EE0C3" fill-opacity="0.16" stroke="#7EE0C3" stroke-width="2"/><text x="712" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FBF7F2">GET /users/3</text><rect x="200" y="259" width="240" height="26" rx="8" fill="#2B2632" stroke="#3A3442" stroke-width="2" stroke-dasharray="5 4"/><text x="212" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B2BF">&lt;Boundary pending&gt;</text><rect x="440" y="259" width="80" height="26" rx="8" fill="#221E29" stroke="#3A3442" stroke-width="2"/><text x="452" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FBF7F2">Ana</text><rect x="520" y="259" width="440" height="26" rx="8" fill="#221E29" stroke="#3A3442" stroke-width="2" opacity="0.55"/><text x="532" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B2BF">Ana  ·  pending(user) = true (conteúdo mantido)</text><rect x="960" y="259" width="170" height="26" rx="8" fill="#FFC94A" fill-opacity="0.22" stroke="#FFC94A" stroke-width="2"/><text x="972" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#FBF7F2">Caio</text><g transform="translate(1140 260) scale(0.8)" stroke="#FFC94A" stroke-width="4" stroke-linecap="round"><path d="M0 0 L5 -5"/><path d="M3 10 H11"/><path d="M0 20 L5 25"/></g><text x="48" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">Primeira carga mostra o pending do Boundary. Depois, o conteúdo antigo fica na tela com pending(user) até o novo chegar.</text></svg>
