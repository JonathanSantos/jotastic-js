<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="360" viewBox="0 0 1188 360" role="img" aria-label="Como o Jotastic funciona"><title>Como o Jotastic funciona</title><rect width="1188" height="360" rx="0" fill="#FBF7F2"/><rect x="20" y="40" width="340" height="250" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/>
<circle cx="56" cy="76" r="14" fill="#FF5B3A"/><text x="56" y="81" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FBF7F2">1</text>
<text x="80" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16131B">Você escreve</text><text x="44" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">let count = 0</text><text x="44" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">const double = count * 2</text><text x="44" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B"></text><text x="44" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">&lt;p&gt;{count} → {double}&lt;/p&gt;</text><text x="44" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">onClick={() =&gt; count++}</text><path d="M368 165 H412" stroke="#FF5B3A" stroke-width="4" stroke-linecap="round"/><path d="M402 155 L414 165 L402 175" fill="none" stroke="#FF5B3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="40" width="340" height="250" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/>
<circle cx="460" cy="76" r="14" fill="#FF5B3A"/><text x="460" y="81" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FBF7F2">2</text>
<text x="484" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16131B">O compilador gera</text><text x="448" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">count = signal(0)</text><text x="448" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">double = memo(…)</text><text x="448" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B"></text><text x="448" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">text(_m0, () =&gt; count.get())</text><text x="448" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#16131B">text(_m1, () =&gt; double.get())</text><path d="M772 165 H816" stroke="#FF5B3A" stroke-width="4" stroke-linecap="round"/><path d="M806 155 L818 165 L806 175" fill="none" stroke="#FF5B3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="828" y="40" width="340" height="250" rx="18" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="2"/>
<circle cx="864" cy="76" r="14" fill="#FF5B3A"/><text x="864" y="81" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FBF7F2">3</text>
<text x="888" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16131B">O DOM recebe</text><rect x="852" y="102" width="276" height="26" rx="7" fill="none" fill-opacity="0" stroke="#E2D9CE" stroke-width="2"/><text x="866" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B">&lt;section&gt;</text><rect x="874" y="136" width="254" height="26" rx="7" fill="none" fill-opacity="0" stroke="#E2D9CE" stroke-width="2"/><text x="888" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B">&lt;h2&gt; Contador</text><rect x="874" y="170" width="254" height="26" rx="7" fill="#FFC94A" fill-opacity="0.3" stroke="#FFC94A" stroke-width="2"/><text x="888" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B">&lt;p&gt; "5"</text><rect x="874" y="204" width="254" height="26" rx="7" fill="#FFC94A" fill-opacity="0.3" stroke="#FFC94A" stroke-width="2"/><text x="888" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B">&lt;p&gt; "10"</text><rect x="874" y="238" width="254" height="26" rx="7" fill="none" fill-opacity="0" stroke="#E2D9CE" stroke-width="2"/><text x="888" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#16131B">&lt;button&gt; +</text><text x="594" y="330" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5E5866">Clique: <tspan fill="#16131B" font-weight="700">count.set(5)</tspan> → só os dois nós de texto são escritos. <tspan fill="#16131B" font-weight="700">Counter()</tspan> não roda de novo.</text></svg>
