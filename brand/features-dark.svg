<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="404" viewBox="0 0 1188 404" role="img" aria-label="Features do Jotastic"><title>Features do Jotastic</title><rect width="1188" height="404" fill="#16131B"/><rect x="18" y="16" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="64" cy="66" r="28" fill="#2B2632"/><circle cx="64" cy="66" r="15" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#FF5B3A" font-weight="700" text-anchor="middle">1×</text><text x="42" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Roda uma vez</text><text x="42" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">O corpo do componente é setup:</text><text x="42" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">sem re-render e sem hooks.</text><rect x="309" y="16" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="355" cy="66" r="28" fill="#2B2632"/><path d="M341 54 V78 M341 64 H355 M341 78 H355" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="361" cy="64" r="5" fill="#FFC94A"/><circle cx="341" cy="52" r="4" fill="#FF5B3A"/><g transform="translate(369 54) scale(0.6)" stroke="#FFC94A" stroke-width="4" stroke-linecap="round"><path d="M0 0 L5 -5"/><path d="M3 10 H11"/><path d="M0 20 L5 25"/></g><text x="333" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Reatividade por nó</text><text x="333" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">Cada parte dinâmica é um binding</text><text x="333" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">com referência direta ao nó.</text><rect x="600" y="16" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="646" cy="66" r="28" fill="#2B2632"/><circle cx="646" cy="66" r="15" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M646 58 V66 L653 71" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="659" cy="55" r="5" fill="#FF5B3A"/><text x="624" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Async nativo</text><text x="624" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">await no componente, abort</text><text x="624" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">automático e &lt;Boundary&gt;.</text><rect x="891" y="16" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="937" cy="66" r="28" fill="#2B2632"/><path d="M922 60 L937 52 L952 60 L937 68 Z" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M922 68 L937 76 L952 68" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="937" cy="60" r="4" fill="#FF5B3A"/><text x="915" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Stores sem seletor</text><text x="915" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">createStore com proxy: só</text><text x="915" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">quem lê a chave reage.</text><rect x="18" y="210" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="64" cy="260" r="28" fill="#2B2632"/><path d="M50 250 H78" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M50 260 H78" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M50 270 H78" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="78" cy="260" r="5" fill="#FFC94A"/><text x="42" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Listas com chave</text><text x="42" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">Reconciliação com LIS e</text><text x="42" y="373" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">selector O(1) por linha.</text><rect x="309" y="210" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="355" cy="260" r="28" fill="#2B2632"/><text x="355" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FBF7F2" font-weight="700" text-anchor="middle">&lt;/&gt;</text><circle cx="371" cy="248" r="4" fill="#FF5B3A"/><text x="333" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">TSX válido</text><text x="333" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">tsc, ESLint e o editor</text><text x="333" y="373" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">funcionam sem plugin novo.</text><rect x="600" y="210" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="646" cy="260" r="28" fill="#2B2632"/><rect x="630" y="248" width="32" height="24" rx="5" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="638" y="256" width="16" height="8" rx="2" fill="#FFC94A"/><text x="624" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Devtools e HMR</text><text x="624" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">Flash nos nós atualizados;</text><text x="624" y="373" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">HMR preserva os stores.</text><rect x="891" y="210" width="279" height="182" rx="18" fill="#221E29" stroke="#3A3442" stroke-width="2"/><circle cx="937" cy="260" r="28" fill="#2B2632"/><path d="M925 260 L934 269 L950 251" stroke="#FBF7F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="950" cy="270" r="4" fill="#FF5B3A"/><text x="915" y="326" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#FBF7F2" font-weight="700">Testes de custo</text><text x="915" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">counts() prova quantos efeitos</text><text x="915" y="373" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B9B2BF">rodaram e quantos nós mudaram.</text></svg>
